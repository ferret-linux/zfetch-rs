name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - stable
      - unstable
    paths:
      - "Cargo.lock"

jobs:
  zbuilder:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: glibc-x86_64
          - target: x86_64-unknown-linux-musl
            suffix: musl-x86_64
          - target: aarch64-unknown-linux-gnu
            suffix: glibc-aarch64
          - target: aarch64-unknown-linux-musl
            suffix: musl-aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Current Version and Branch
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d '"' -f2)
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH" = "unstable" ]; then
            BINARY_NAME="zfetch-${VERSION}-unstable-${{ matrix.suffix }}"
          else
            BINARY_NAME="zfetch-${VERSION}-${{ matrix.suffix }}"
          fi
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

      - name: Install targets and cross-compile tools
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build Release Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename and Strip Binary
        run: |
          mv target/${{ matrix.target }}/release/zfetch ${{ env.BINARY_NAME }}
          strip ${{ env.BINARY_NAME }} || true

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: ${{ env.BINARY_NAME }}

  verify-versions:
    needs: zbuilder
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cargo.toml and PKGBUILD versions match
        id: check
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d '"' -f2)
          PKGBUILD_VERSION=$(grep '^pkgver=' PKGBUILD | cut -d '=' -f2)
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "PKGBUILD version:   $PKGBUILD_VERSION"
          if [ "$CARGO_VERSION" != "$PKGBUILD_VERSION" ]; then
            echo "ERROR: Version mismatch! Cargo.toml=$CARGO_VERSION PKGBUILD=$PKGBUILD_VERSION"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> $GITHUB_OUTPUT

  create-tag:
    needs: verify-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      release_name: ${{ steps.info.outputs.release_name }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Tag and Release
        id: info
        run: |
          VERSION=${{ needs.verify-versions.outputs.version }}
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH" = "unstable" ]; then
            TAG="v${VERSION}-unstable"
            RELEASE_NAME="zfetch v${VERSION} (unstable)"
            PRERELEASE="true"
          else
            TAG="v${VERSION}"
            RELEASE_NAME="zfetch v${VERSION}"
            PRERELEASE="false"
          fi
          git tag $TAG
          git push origin $TAG
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.release_name }}
          prerelease: ${{ steps.info.outputs.prerelease }}

  upload-binaries:
    needs: create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: glibc-x86_64
          - target: x86_64-unknown-linux-musl
            suffix: musl-x86_64
          - target: aarch64-unknown-linux-gnu
            suffix: glibc-aarch64
          - target: aarch64-unknown-linux-musl
            suffix: musl-aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get binary name
        run: |
          VERSION=${{ needs.create-tag.outputs.tag }}
          VERSION=${VERSION#v}
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH" = "unstable" ]; then
            VERSION=${VERSION%-unstable}
            BINARY_NAME="zfetch-${VERSION}-unstable-${{ matrix.suffix }}"
          else
            BINARY_NAME="zfetch-${VERSION}-${{ matrix.suffix }}"
          fi
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          files: ${{ env.BINARY_NAME }}

  publish-aur:
    needs: [create-tag, upload-binaries]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stable

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
          EOF

      - name: Clone AUR repo
        run: |
          git clone ssh://aur@aur.archlinux.org/zfetch-rs.git ~/aur
          sudo chown -R $USER:$USER ~/aur

      - name: Copy PKGBUILD from repo
        run: cp PKGBUILD ~/aur/PKGBUILD

      - name: Generate .SRCINFO
        run: |
          docker run --rm -v ~/aur:/pkg archlinux:latest bash -c "
            pacman -Sy --noconfirm pacman-contrib &&
            useradd -m builder &&
            chown -R builder /pkg &&
            su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'
          "

      - name: Fix permissions after docker
        run: sudo chown -R $USER:$USER ~/aur

      - name: Push to AUR
        run: |
          cd ~/aur
          git config user.name "zodium-project"
          git config user.email "dev.zodium.project@gmail.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to ${{ needs.create-tag.outputs.tag }}"
          git push