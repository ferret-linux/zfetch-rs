name: Build zutils Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        program: [zgpu-rs, zrun-rs, zync-rs]
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get Program Version
        run: |
          VERSION=$(grep '^version' ${{ matrix.program }}/Cargo.toml | head -n1 | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build binary
        run: |
          PROGRAM=${{ matrix.program }}
          TARGET=${{ matrix.target }}
          VERSION=${{ env.VERSION }}
          BINARY_NAME="${PROGRAM}-${VERSION}-${TARGET}"
          echo "Building $BINARY_NAME..."

          mkdir -p release_assets

          if [[ "$TARGET" == "aarch64-unknown-linux-musl" ]]; then
            echo "Building ARM musl in Docker..."
            docker run --rm -v $PWD:/src rustembedded/cross:aarch64-unknown-linux-musl-0.2.2 sh -c "
              cd /src/$PROGRAM &&
              cargo build --release --locked --target aarch64-unknown-linux-musl
            "
            mv "$PROGRAM/target/aarch64-unknown-linux-musl/release/$PROGRAM" "release_assets/$BINARY_NAME" || true
          else
            echo "Building x86_64 musl locally..."
            rustup target add $TARGET || true
            sudo apt-get update
            sudo apt-get install -y musl-tools
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            cargo build --release --locked --target $TARGET || exit 1
            mv "$PROGRAM/target/$TARGET/release/$PROGRAM" "release_assets/$BINARY_NAME"
          fi

          strip "release_assets/$BINARY_NAME" || true
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}
          path: release_assets/${{ env.BINARY_NAME }}

  verify-builds:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      all_ok: ${{ steps.check.outputs.all_ok }}
    steps:
      - name: Verify all artifacts exist
        id: check
        run: |
          EXPECTED_COUNT=6 # 3 programs x 2 targets
          ACTUAL_COUNT=$(gh run artifacts list --json name --jq '.[] | .name' | wc -l)
          echo "Found $ACTUAL_COUNT artifacts, expecting $EXPECTED_COUNT"
          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "Not all builds succeeded."
            echo "all_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "all_ok=true" >> $GITHUB_OUTPUT

  create-release:
    runs-on: ubuntu-latest
    needs: verify-builds
    if: needs.verify-builds.outputs.all_ok == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version and tag
        id: version
        run: |
          VERSION=$(grep '^version' zgpu-rs/Cargo.toml | head -n1 | cut -d '"' -f2)
          TAG="release-$(date +%d-%m-%y)"
          RELEASE_NAME="zutils $VERSION ($TAG)"
          git tag $TAG
          git push origin $TAG
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: release_assets/*